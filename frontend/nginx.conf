server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in every asset file name, so these can be cached forever:
    # a new build produces new names, and index.html (never cached) points to them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/vehicles, /history?...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
